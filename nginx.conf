# ==============================================================================
# Nginx Configuration for sharada-school.co.in/web
# Location on Linux: /etc/nginx/sites-available/sharada-school.co.in
# Symlink: ln -s /etc/nginx/sites-available/sharada-school.co.in /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name sharada-school.co.in www.sharada-school.co.in;

    # Client body size limit for bulk uploads
    client_max_body_size 25M;

    # ==========================================================================
    # 1. SHARADA SCHOOL PORTAL & API (Subpath /web)
    # Reverse proxy to Node.js backend (running on port 4000)
    # ==========================================================================
    location /web {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & API timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Direct API proxy (fallback if any client requests hit /api directly)
    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================================
    # 2. ROOT DOMAIN (sharada-school.co.in/)
    # If you have an existing website (WordPress / HTML / PHP), configure it here.
    # Otherwise, redirect root visitors directly to the /web portal:
    # ==========================================================================
    location = / {
        return 301 /web;
    }

    # (Uncomment below if root is a separate static/WordPress site in /var/www/html)
    # location / {
    #     root /var/www/html;
    #     index index.html index.php;
    #     try_files $uri $uri/ /index.php?$args;
    # }
}
